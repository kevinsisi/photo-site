name: Deploy to NAS

on:
  workflow_run:
    workflows: ["Build and Push Docker Image"]
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

env:
  DOCKERHUB_USERNAME: kevin950805
  IMAGE_NAME: photo-site
  DEPLOY_USER: ${{ secrets.DEPLOY_USER || 'root' }}
  DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '/volume1/docker/photo-site' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.DEPLOY_SERVER_IP }} >> ~/.ssh/known_hosts

      - name: Sync compose file
        run: |
          ssh -i ~/.ssh/deploy_key "${DEPLOY_USER}@${{ secrets.DEPLOY_SERVER_IP }}" "mkdir -p '${DEPLOY_PATH}'"
          scp -O -i ~/.ssh/deploy_key docker-compose.yml "${DEPLOY_USER}@${{ secrets.DEPLOY_SERVER_IP }}:${DEPLOY_PATH}/docker-compose.yml"

      - name: Deploy via SSH
        run: |
          ssh -i ~/.ssh/deploy_key "${DEPLOY_USER}@${{ secrets.DEPLOY_SERVER_IP }}" "
            set -e
            cd '${DEPLOY_PATH}'
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -af --filter 'until=24h' || true
            docker compose ps
          "

      - name: Health check
        run: |
          for i in $(seq 1 24); do
            if curl -fsS https://ching.sisihome.org/api/categories; then
              exit 0
            fi
            sleep 5
          done
          exit 1
