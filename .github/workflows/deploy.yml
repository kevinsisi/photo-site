name: Deploy to amd64 Desktop

on:
  push:
    branches:
      - main
    paths:
      - 'packages/**'
      - 'Dockerfile'
      - 'deploy/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.base.json'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

env:
  DEPLOY_USER: ${{ secrets.DEPLOY_USER || 'kevin' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:github-actions

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.DEPLOY_SERVER_IP }}" >> ~/.ssh/known_hosts

      - name: Sync source and proxy files
        env:
          DEPLOY_SERVER_IP: ${{ secrets.DEPLOY_SERVER_IP }}
          SOURCE_PATH: /home/kevin/DockerCompose/photo-site/source
          PROXY_DEPLOY_PATH: ${{ secrets.PROXY_DEPLOY_PATH }}
        run: |
          tar \
            --exclude=.git \
            --exclude=node_modules \
            --exclude='packages/*/node_modules' \
            --exclude='packages/*/dist' \
            --exclude=data \
            --exclude='.env*' \
            -czf /tmp/photo-site-source.tgz .

          ssh -i ~/.ssh/deploy_key "${DEPLOY_USER}@${DEPLOY_SERVER_IP}" \
            "mkdir -p '${SOURCE_PATH}' '${PROXY_DEPLOY_PATH}' /srv/data4tb/photo-site/data"
          scp -i ~/.ssh/deploy_key /tmp/photo-site-source.tgz \
            "${DEPLOY_USER}@${DEPLOY_SERVER_IP}:/home/kevin/DockerCompose/photo-site/photo-site-source.tgz"
          ssh -i ~/.ssh/deploy_key "${DEPLOY_USER}@${DEPLOY_SERVER_IP}" \
            "cd '${SOURCE_PATH}' && tar -xzf ../photo-site-source.tgz"

          scp -i ~/.ssh/deploy_key deploy/proxy/docker-compose.yml \
            "${DEPLOY_USER}@${DEPLOY_SERVER_IP}:${PROXY_DEPLOY_PATH}/docker-compose.yml"
          scp -i ~/.ssh/deploy_key deploy/proxy/nginx.conf \
            "${DEPLOY_USER}@${DEPLOY_SERVER_IP}:${PROXY_DEPLOY_PATH}/nginx.conf"

      - name: Deploy app and proxy on amd64
        env:
          DEPLOY_SERVER_IP: ${{ secrets.DEPLOY_SERVER_IP }}
          SOURCE_DEPLOY_PATH: /home/kevin/DockerCompose/photo-site/source/deploy
          PROXY_DEPLOY_PATH: ${{ secrets.PROXY_DEPLOY_PATH }}
        run: |
          ssh -i ~/.ssh/deploy_key "${DEPLOY_USER}@${DEPLOY_SERVER_IP}" "
            set -e
            cd '${SOURCE_DEPLOY_PATH}'
            docker compose up -d --build --force-recreate
            cd '${PROXY_DEPLOY_PATH}'
            docker compose up -d --force-recreate
            docker image prune -af --filter 'until=24h' || true
          "

      - name: Health check
        run: |
          for i in $(seq 1 24); do
            if curl -fsS "https://ching.sisihome.org/api/categories"; then
              exit 0
            fi
            sleep 5
          done

          ssh -i ~/.ssh/deploy_key "${{ env.DEPLOY_USER }}@${{ secrets.DEPLOY_SERVER_IP }}" \
            "cd /home/kevin/DockerCompose/photo-site/source/deploy && docker compose ps && docker logs photo-site --tail 80" || true
          exit 1

      - name: Admin session check
        env:
          ADMIN_USERNAME: ${{ secrets.PHOTO_SITE_ADMIN_USERNAME }}
          ADMIN_PASSWORD: ${{ secrets.PHOTO_SITE_ADMIN_PASSWORD }}
        run: |
          if [ -z "${ADMIN_USERNAME}" ] || [ -z "${ADMIN_PASSWORD}" ]; then
            echo "Skipping admin session check because PHOTO_SITE_ADMIN_USERNAME/PASSWORD are not set."
            exit 0
          fi

          cookie_file="$(mktemp)"
          curl -fsS -c "$cookie_file" \
            -H 'Content-Type: application/json' \
            -d "{\"username\":\"${ADMIN_USERNAME}\",\"password\":\"${ADMIN_PASSWORD}\"}" \
            https://ching.sisihome.org/api/admin/login
          curl -fsS -b "$cookie_file" https://ching.sisihome.org/api/admin/me
